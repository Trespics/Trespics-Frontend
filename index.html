<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Florante | Tech, Software, Systems, Hackathons & Blogs</title>
    <meta name="description" content="Florante (Florant) is a leading tech platform building modern software, intelligent computer systems, hackathons, and technology blogs. Discover innovative digital solutions and software engineering." />
    <meta name="keywords" content="florante, florant, hackathons, blogs, software, systems, tech, technology, computer, computer science, software development, web applications, programming, tech platform, coding, smart systems, enterprise software" />
    <meta name="author" content="Florante (Florant)" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#1a472a" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://florante.tech/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://florante.tech/" />
    <meta property="og:title" content="Florante | Tech, Software, Systems, Hackathons & Blogs" />
    <meta property="og:description" content="Florante (Florant) is a leading tech platform building modern software, intelligent computer systems, hackathons, and technology blogs." />
    <meta property="og:image" content="https://florante.tech/logo.png" />
    <meta property="og:site_name" content="Florante" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://florante.tech/" />
    <meta name="twitter:title" content="Florante | Tech, Software, Systems, Hackathons & Blogs" />
    <meta name="twitter:description" content="Florante (Florant) builds modern software, computer systems, hackathons, and technology blogs." />
    <meta name="twitter:image" content="https://florante.tech/logo.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Global JSON-LD Organization & WebSite Schemas -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://florante.tech/#organization",
          "name": "Florante",
          "alternateName": ["Florant", "Florante Tech"],
          "url": "https://florante.tech/",
          "logo": "https://florante.tech/logo.png",
          "description": "Florante builds innovative software, intelligent computer systems, hackathons, and technology blogs.",
          "keywords": ["florante", "florant", "hackathons", "blogs", "software", "systems", "tech", "technology", "computer"],
          "sameAs": [
            "https://github.com/florante",
            "https://twitter.com/florante_tech"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://florante.tech/#website",
          "url": "https://florante.tech/",
          "name": "Florante Tech Platform",
          "publisher": {
            "@id": "https://florante.tech/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://florante.tech/blogs?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
